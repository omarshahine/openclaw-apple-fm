name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      # The plugin imports openclaw/plugin-sdk/* (a peer dependency), and the SDK
      # package also provides the tsc used below. Typecheck links it into
      # node_modules, so it runs before the unit tests that import those modules.
      - name: Install OpenClaw (plugin SDK + tsc)
        run: npm install -g openclaw@latest
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  # The model paths (fm serve, JXA rendering, OCR accuracy) need macOS 27 with an
  # accepted Apple Foundation Models CLI license, so they run manually:
  #   npm run smoke && node scripts/smoke.mjs --ocr <file.pdf>
